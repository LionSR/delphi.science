# Python and site tests. The site tests need dist/index.json, so it is built first from
# fixtures/entries.jsonl on a local PGlite server (site/scripts/db.ts), never the real database.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: site

      - name: Build, from the sample entries
        run: |
          node --experimental-strip-types site/scripts/db.ts --entries fixtures/entries.jsonl > db.url &
          for i in $(seq 60); do [ -s db.url ] && break; sleep 1; done
          SUPABASE_DB_URL="$(head -1 db.url)" python3 index.py build
      - name: Harvester tests
        run: |
          python3 test_index.py
          python3 test_candidates.py
          python3 test_x_candidates.py
      - name: Site tests
        working-directory: site
        run: |
          npm test
          npx tsc --noEmit -p .
