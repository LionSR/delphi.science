# Daily: harvest, refresh stale entries, recheck discussion links, label new records (DeepSeek, optional),
# build, and load into Supabase Postgres. Entries live in Supabase, so nothing is committed.
name: Open index

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ORI_DEEPSEEK_ENABLED: ${{ vars.ORI_DEEPSEEK_ENABLED }}
      ORI_DEEPSEEK_MAX_RUN_USD: ${{ vars.ORI_DEEPSEEK_MAX_RUN_USD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: pip install -r requirements.txt
      - name: Harvest
        run: python3 index.py harvest
      - name: Refresh the stalest entries
        run: python3 index.py refresh  # up to 200 entries older than a week
      - name: Recheck discussion links
        run: python3 index.py discuss --recheck  # drops deleted posts
      - name: Check optional DeepSeek labeling configuration
        id: label_config
        run: |
          python3 - <<'PY'
          import os
          import index
          try:
              enabled, cap = index.generation_settings()
              enabled = enabled and cap > 0
          except ValueError:
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'enabled={str(enabled).lower()}', file=output)
          if not enabled:
              print('::notice::Optional DeepSeek labeling is disabled: owner opt-in and a positive authorized per-run USD budget are required. Metadata ingestion continues.')
          PY
      - name: Label new records
        id: label
        if: steps.label_config.outputs.enabled == 'true'
        continue-on-error: true # labeling failure must not block build and load
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 index.py label
      - name: Build
        run: python3 index.py build

      - name: Load into Supabase
        working-directory: site
        run: |
          npm ci
          node --experimental-strip-types scripts/load-open-index.ts ../dist/index.json

      - name: Report attempted classification failure
        if: steps.label.outcome == 'failure'
        run: |
          echo '::error::Metadata ingestion completed, but optional DeepSeek classification failed. Unlabelled records remain unlabelled; no alternate provider was used.'
          exit 1
