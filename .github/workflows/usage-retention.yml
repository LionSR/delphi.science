name: Usage retention
on:
  schedule:
    - cron: '11 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Remove counters older than 90 UTC dates
        working-directory: site
        run: node --experimental-strip-types scripts/prune-usage.ts
