# Daily, before the curator routine: write items that may respond to records (candidates.py) to
# reports/responses/<date>.md for a person to review.
name: Candidate responses

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }} # optional
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        env:
          SUPABASE_DB_URL: ''  # install scripts of dependencies do not get the database

      - name: Find candidates
        run: |
          out="reports/responses/$(date -u +%F).md"
          python3 candidates.py --days 4 --out "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report
        uses: ./.github/actions/commit-as-owner
        with:
          paths: reports
          message: 'Candidate responses to {date}'
