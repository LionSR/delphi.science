# Weekly: write arXiv papers and MathOverflow questions that may respond to AI-made records
# (candidates.py) to reports/responses/<date>.md for a person to review.
name: Candidate responses

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Find candidates
        run: |
          out="reports/responses/$(date -u +%F).md"
          python3 candidates.py --out "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report
        uses: ./.github/actions/commit-as-owner
        with:
          paths: reports
          message: 'Candidate responses for the week to {date}'
