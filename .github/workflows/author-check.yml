# Vercel's Hobby plan blocks a Git deployment of this private repository when the commit's
# author is not the account owner, so every commit on main must be authored as the owner.
# Co-Authored-By trailers are fine: only the author email is checked.
name: Commit authors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OWNER_EMAIL: 14889516+LionSR@users.noreply.github.com

jobs:
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every new commit is authored as the owner
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable base: check the pushed commit alone.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$HEAD -1"; else range="$BASE..$HEAD"; fi
          bad=$(git log --format='%h %ae %s' $range | awk -v ok="$OWNER_EMAIL" '$2 != ok')
          if [ -n "$bad" ]; then
            echo "::error::These commits are not authored as $OWNER_EMAIL, so Vercel will not deploy them:"
            echo "$bad"
            echo "Fix: git config user.email $OWNER_EMAIL, then rewrite the commits' author (git commit --amend --reset-author, or git rebase -r --exec 'git commit --amend --no-edit --reset-author' $BASE)."
            exit 1
          fi
