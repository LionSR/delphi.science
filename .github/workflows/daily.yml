# The open index's daily pull, as SciRate pulls arXiv each day: harvest every enabled job in
# harvest.json, read the stalest entries again from their sources, read every discussion link again
# (a deleted post drops out), label the new records, build, and load the build into Supabase Postgres.
# The entries live in Supabase (open_index.entries, store.py), so nothing is committed.
# Secrets: SUPABASE_DB_URL, the database. Labels come from DeepSeek, with the key the site's moderator
# uses: the secret deepseek_api_key in Supabase Vault (or DEEPSEEK_API_KEY).
name: Open index

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: pip install -r requirements.txt
      - name: Harvest
        run: python3 index.py harvest
      - name: Refresh the stalest entries
        run: python3 index.py refresh  # 200 a day, each read again once it is a week old
      - name: Recheck discussion links
        run: python3 index.py discuss --recheck  # a deleted post drops out within a day
      - name: Label new records
        run: python3 index.py label
      - name: Build
        run: python3 index.py build

      - name: Load into Supabase
        working-directory: site
        run: |
          npm ci
          node --experimental-strip-types scripts/load-open-index.ts ../dist/index.json
