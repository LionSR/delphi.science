# Each week, list new arXiv papers and MathOverflow questions that may respond to an AI-made
# record (candidates.py) in reports/responses/<date>.md. Nothing is attached: a person reads
# the report and runs the `index.py discuss` commands for the ones that do respond.
name: Candidate responses

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest # its python3 (3.12) is enough: candidates.py needs only the standard library
    steps:
      - uses: actions/checkout@v7
        with: # everything but entries/arxiv, which holds most of the files and which candidates.py does not read
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/entries/arxiv/

      - name: Find candidates
        run: |
          out="reports/responses/$(date -u +%F).md"
          python3 candidates.py --out "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report
        uses: ./.github/actions/commit-as-owner
        with:
          paths: reports
          message: 'Candidate responses for the week to {date}'
