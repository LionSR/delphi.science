# The tests, on every pull request and every push to main: the harvester's (test_index.py,
# test_candidates.py) and the site's (npm test, the type check). The site's tests load dist/index.json into
# an in-memory Postgres, so the index is built first, from the sample of entries in fixtures/entries.jsonl
# served by PGlite (site/scripts/db.ts): CI never reads the real database. test_index.py starts its own,
# empty one. The build and the tests that read APP papers reach the APP registry, agenticpapers.app.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency: # a newer push to the same branch or pull request replaces a run still going
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: site

      - name: Build, from the sample entries
        run: |
          node --experimental-strip-types site/scripts/db.ts --entries fixtures/entries.jsonl > db.url &
          for i in $(seq 60); do [ -s db.url ] && break; sleep 1; done
          SUPABASE_DB_URL="$(head -1 db.url)" python3 index.py build
      - name: Harvester tests
        run: |
          python3 test_index.py
          python3 test_candidates.py
      - name: Site tests
        working-directory: site
        run: |
          npm test
          npx tsc --noEmit -p .
